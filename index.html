<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumping Carrot</title>
  <style>
    * { margin: 0; padding: 0; }

    body {
      background-color: #2e8b57;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .carrot {
      animation: jump 1s ease-in-out infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Green leafy top */
    .leaves {
      display: flex;
      gap: 4px;
      margin-bottom: -10px;
      z-index: 1;
    }

    .leaf {
      width: 14px;
      height: 50px;
      background: #228b22;
      border-radius: 50% 50% 20% 20%;
    }

    .leaf:nth-child(1) { transform: rotate(-20deg); }
    .leaf:nth-child(2) { height: 60px; }
    .leaf:nth-child(3) { transform: rotate(20deg); }

    /* Orange carrot body */
    .body {
      width: 80px;
      height: 200px;
      background: linear-gradient(135deg, #ff8c00, #ff6600);
      border-radius: 40px 40px 10px 10px;
      clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
      position: relative;
    }

    /* Little lines on the carrot */
    .body::before {
      content: '';
      position: absolute;
      top: 30%;
      left: 20%;
      width: 60%;
      height: 3px;
      background: rgba(0,0,0,0.15);
      border-radius: 2px;
      box-shadow:
        0 25px 0 rgba(0,0,0,0.12),
        0 50px 0 rgba(0,0,0,0.09);
    }

    /* Shadow on the ground */
    .shadow {
      width: 100px;
      height: 20px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 50%;
      margin-top: 20px;
      animation: shadow 1s ease-in-out infinite;
    }

    @keyframes jump {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-120px); }
    }

    @keyframes shadow {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(0.5); opacity: 0.1; }
    }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: column; align-items: center;">
    <div class="carrot">
      <div class="leaves">
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
      </div>
      <div class="body"></div>
    </div>
    <div class="shadow"></div>
  </div>
</body>
</html>
